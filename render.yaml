# PostgreSQL is hosted on Neon Free; set DATABASE_URL securely in Render.
services:
  - type: web
    name: shikhar-plantdoc
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22.16.0
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: MANDI_FETCH_LIMIT
        value: "1000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

