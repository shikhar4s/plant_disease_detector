# Uses the existing free preview database in Shikhar's workspace.
# This database expires on 2026-10-11; connect Neon or upgrade before then.
services:
  - type: web
    name: shikhar-plantdoc
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22.16.0
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plantdoc-preview-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
